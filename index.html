<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image.png" type="image/x-icon">
</head>
<body>
    <div class="signup-container">
        <h1>Sign Up</h1>
        <main>

            <form>
                <div class="input-group">
                    <input type="text" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Confirm Password" required>
                </div>

                <div class="input-group">
                    <input type="date" placeholder="dd-mm-yyyy" required>
                </div>
            
                <div class="radio-group" required>
                    <label><input type="radio" name="role"> Student</label>
                    <label><input type="radio" name="role"> Employee</label>
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" required> I agree to all the Terms and conditions</label>
                </div>
                <button type="submit" class="signup-btn">Signup</button>
            </form>
        </main>
        <footer>
            <p>&copy; 2026 Sign Up Form. All rights reserved.</p>
        </footer>
    </div>
    
</body>
</html>
